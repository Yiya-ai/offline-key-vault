name: macOS standard DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare public build dependencies (development only)
        run: |
          python -c "from pathlib import Path; Path('build').mkdir(exist_ok=True); Path('build/standard-requirements.txt').write_text(''.join(line for line in Path('requirements.txt').read_text().splitlines(True) if not line.startswith('pykcs11==')))"
          python -m pip install --no-deps -r build/standard-requirements.txt
          python -m pip install PyInstaller==6.16.0 pytest==8.4.2
          python -c "from pathlib import Path; import importlib.metadata as m; p=Path(m.distribution('pyjks').locate_file('jks/__init__.py')); p.write_text(p.read_text().replace('from .bks import *','# BKS intentionally excluded'))"
          python -c "import platform; assert platform.machine() == '${{ matrix.architecture }}', platform.machine()"
      - name: Source privacy and native storage support
        run: |
          python -I -S tools/release.py audit --index
          python -I -S build_macos.py --prepare-only
      - name: Native macOS storage, cryptography and GUI regressions
        run: |
          mkdir -p test-results
          python -m pytest -q tests/test_macos.py tests/test_core.py tests/test_protection.py tests/test_public_text.py tests/test_export_paircheck.py tests/test_desktop_improvements.py --basetemp=test-results/macos-ci
      - name: Build DMG and test mounted installation
        run: python -I -S build_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-standard-${{ matrix.architecture }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/macos-verification-*.json
          if-no-files-found: error
          retention-days: 7
