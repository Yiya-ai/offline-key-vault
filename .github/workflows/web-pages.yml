name: Deploy browser toolbox (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit committed source
        run: python -I -S tools/release.py audit --index
      - name: Install locked public build dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Check dependency advisories
        run: |
          npm audit --prefix web --audit-level=low
          python web/audit_dependencies.py --online
      - name: Build and verify the static distribution
        run: |
          python web/build_wasm.py
          python web/build_web.py --fetch
          python web/verify_build.py
          python web/tests/test_build_security.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
